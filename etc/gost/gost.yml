services:
  - name: liims-http-ipv4
    addr: "127.0.0.1:3128"
    bypass: liims-hosts
    hosts: liims-hosts
    handler:
      type: red
      metadata:
        sniffing: true
        sniffing.timeout: 5s
        sniffing.fallback: false
    listener:
      type: red

  - name: liims-http-ipv6
    addr: "[::1]:3128"
    bypass: liims-hosts
    hosts: liims-hosts
    handler:
      type: red
      metadata:
        sniffing: true
        sniffing.timeout: 5s
        sniffing.fallback: false
    listener:
      type: red

  - name: liims-https-ipv4
    addr: "127.0.0.1:3129"
    bypass: liims-hosts
    hosts: liims-hosts
    handler:
      type: red
      metadata:
        sniffing: true
        sniffing.timeout: 5s
        sniffing.fallback: false
    listener:
      type: red

  - name: liims-https-ipv6
    addr: "[::1]:3129"
    bypass: liims-hosts
    hosts: liims-hosts
    handler:
      type: red
      metadata:
        sniffing: true
        sniffing.timeout: 5s
        sniffing.fallback: false
    listener:
      type: red

bypasses:
  - name: liims-hosts
    whitelist: true
    file:
      path: /etc/gost/bypass.txt

hosts:
  - name: liims-hosts
    file:
      path: /etc/gost/hosts.txt
