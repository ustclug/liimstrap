# Only local, transparently redirected kiosk traffic reaches these listeners.
http_port 127.0.0.1:3128 intercept
http_port [::1]:3128 intercept
# Squid needs a normal HTTP port for its internal URLs; access is denied.
http_port 127.0.0.1:3130 name=liims_internal
# Squid requires a certificate configured here even when all permitted TLS
# connections use splice and the certificate is never presented to clients.
https_port 127.0.0.1:3129 intercept ssl-bump name=liims_tls cert=/etc/liims/squid.pem generate-host-certificates=off
https_port [::1]:3129 intercept ssl-bump name=liims_tls cert=/etc/liims/squid.pem generate-host-certificates=off
visible_hostname liims
hosts_file /etc/hosts
host_verify_strict on
client_dst_passthru off
cache deny all
cache_mem 16 MB

acl liims_hosts dstdomain "/etc/liims/allowed-hosts"
acl liims_http_ports port 80 3000
acl liims_tls_port myportname liims_tls
acl liims_internal myportname liims_internal
acl CONNECT method CONNECT
http_access deny liims_internal
http_access allow liims_tls_port
http_access deny CONNECT
http_access deny !liims_http_ports
http_access allow liims_hosts
http_access deny all

# An intercepted TLS connection has no CONNECT hostname until ClientHello.
# Match only the client's SNI; never use the destination IP as a fallback.
acl hello_step at_step SslBump1
acl liims_sni ssl::server_name --client-requested "/etc/liims/allowed-hosts"
ssl_bump peek hello_step
ssl_bump splice liims_sni
ssl_bump terminate all
